[project]
name = "dissertation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blackjax",
    "chex>=0.1.91",
    "corner>=2.2.3",
    "equinox>=0.13.2",
    "ipykernel>=7.1.0",
    "ipython>=9.9.0",
    "jax>=0.8.2",
    "jupyter>=1.1.1",
    "lineax>=0.0.8",
    "matplotlib>=3.10.8",
    "nbstripout>=0.9.0",
    "optax>=0.2.6",
    "optimistix>=0.0.11",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "scienceplots>=2.2.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "tyro>=1.0.5",
]


[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "./"
]

[tool.uv.sources]
